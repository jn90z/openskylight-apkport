apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def signingPath = System.getenv('OSL_KEYSTORE_PATH')
def buildNumber = System.getenv('OSL_VERSION_CODE') ?: '1'

android {
    namespace 'com.jn90z.openskylight'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.jn90z.openskylight'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode buildNumber.toInteger()
        versionName new groovy.json.JsonSlurper().parse(file('../../package.json')).version
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    buildFeatures { buildConfig true }
    sourceSets {
        main.assets.srcDir '../../out/android-backend'
        main.assets.srcDir '../../out/companion-package'
    }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('OSL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OSL_KEY_ALIAS')
                keyPassword System.getenv('OSL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingPath) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'io.github.dokar3:quickjs-kt-android:1.0.0-alpha10'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyOpenSkyLightAssets') {
    doLast {
        for (def path : ['../../out/android-backend/backend.js', '../../out/companion-package/companion/index.html',
                         'src/main/assets/public/index.html']) {
            if (!file(path).isFile()) throw new GradleException('Run node scripts/android-prepare.mjs from the repository root')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyOpenSkyLightAssets' }
