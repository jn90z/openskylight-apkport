name: Android APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified signed APK as a GitHub Release
        type: boolean
        default: true
  push:
    branches: [android]
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/android-prepare.mjs'
      - 'package*.json'
      - '*.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OSL_VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.OSL_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript and shared behavior
        run: |
          npm run typecheck
          npm rebuild better-sqlite3
          npx --no-install vitest run
      - run: node scripts/android-prepare.mjs
      - name: Build and unit test debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon --max-workers=2
      - name: Report the debug APK's OAuth signing fingerprint
        working-directory: android
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/signing-certificate.txt
          cat app/build/outputs/apk/debug/signing-certificate.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: OpenSkyLight-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/signing-certificate.txt
          if-no-files-found: error
      - name: Enable KVM for Android instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test WebView and native backend on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && (./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 || { adb logcat -d -s OpenSkyLight AndroidRuntime; exit 1; })
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OpenSkyLight-Android-instrumentation
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Require persistent signing for published releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: test "$HAS_KEYSTORE" = 'true'
      - name: Restore persistent signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          OSL_KEYSTORE_BASE64: ${{ secrets.OSL_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$OSL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openskylight-release.jks"
      - name: Build and verify signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          OSL_KEYSTORE_PATH: ${{ runner.temp }}/openskylight-release.jks
          OSL_KEYSTORE_PASSWORD: ${{ secrets.OSL_KEYSTORE_PASSWORD }}
          OSL_KEY_ALIAS: ${{ secrets.OSL_KEY_ALIAS }}
          OSL_KEY_PASSWORD: ${{ secrets.OSL_KEY_PASSWORD }}
          OSL_CERT_SHA256: ${{ vars.OSL_CERT_SHA256 }}
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/signing-certificate.txt
          cert="$(sed -n -E 's/^(Signer #1|V2 Signer): certificate SHA-256 digest: //p' app/build/outputs/apk/release/signing-certificate.txt | head -1)"
          expected="$(printf '%s' "$OSL_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$cert"
          test -n "$expected"
          test "${cert,,}" = "$expected"
      - uses: actions/upload-artifact@v6
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: OpenSkyLight-Android-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed Android release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="android-v$version-build-$OSL_VERSION_CODE"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/OpenSkyLight-$version-$OSL_VERSION_CODE.apk"
          cp android/app/build/outputs/apk/release/signing-certificate.txt release-assets/
          (cd release-assets && sha256sum ./*.apk > SHA256SUMS)
          cat > "$RUNNER_TEMP/android-release-notes.txt" <<'NOTES'
          Signed Android release for home installation, using the permanent repository signing key.
          Requires Android 9 or later. Register the certificate SHA-1 in signing-certificate.txt with the Android OAuth client for com.jn90z.openskylight.
          Updates require the same signing key. Existing debug installs use a different key and require preserving local data before replacement.
          Automated checks include shared tests and Android 9 integration tests. Physical tablet performance and live Google account authorization require device verification.
          NOTES
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "OpenSkyLight Android $version (build $OSL_VERSION_CODE)" --notes-file "$RUNNER_TEMP/android-release-notes.txt" --latest=false
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/openskylight-release.jks"
