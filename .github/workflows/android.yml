name: Android prototype APK
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'src/**'
      - 'scripts/android-prepare.mjs'
      - 'android.vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Show tool versions and runner SDK
        run: |
          java -version
          node --version
          npm --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - run: node scripts/android-prepare.mjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v6
        with:
          name: OpenSkyLight-Android-PROTOTYPE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
