<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'"
    />
    <title>OpenSkyLight</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A failed module load on an old system WebView otherwise leaves a blank screen.
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.textContent = 'OpenSkyLight could not start. Update Android System WebView and Chrome, then reopen the app.';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/android-main.tsx"></script>
  </body>
</html>
